[project]
name = "ws"
version = "0.1.0"
description = "Event-driven trading research and execution system"
requires-python = ">=3.11"
dependencies = [
    "datasketch>=2.0.0",
    "duckdb>=1.5.6",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "websockets>=17.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["ws"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
